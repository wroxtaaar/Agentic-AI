<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oracle VPS Agent</title><style>body{margin:auto;max-width:1000px;padding:16px;font-family:system-ui;background:#0d0f12;color:#eee}#chat{height:65vh;overflow:auto;border:1px solid #333;border-radius:14px;padding:12px}.m{white-space:pre-wrap;padding:12px;margin:8px 0;border-radius:12px}.u{background:#19324a}.a{background:#1d2a20}.t{color:#999;font-size:12px}form{display:flex;gap:8px;margin-top:10px}textarea,input{background:#15171a;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;box-sizing:border-box}textarea{flex:1;min-height:70px}button{border:0;border-radius:10px;padding:10px 16px;font-weight:700}#token{width:100%;margin:8px 0}</style></head><body><h2>Oracle VPS Agent</h2><div id="status">Multi-agent VPS control plane</div><input id="token" type="password" placeholder="AGENT_API_TOKEN"><div id="chat"></div><form><textarea id="q" placeholder="Ask the agent to inspect, diagnose or plan work..."></textarea><button>Send</button></form><script>const c=document.querySelector('#chat'),q=document.querySelector('#q'),t=document.querySelector('#token');function add(x,k){let d=document.createElement('div');d.className='m '+k;d.textContent=x;c.append(d);c.scrollTop=c.scrollHeight}document.querySelector('form').onsubmit=async e=>{e.preventDefault();let m=q.value.trim();if(!m)return;add(m,'u');q.value='';add('Working…','a');let wait=c.lastChild;try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t.value},body:JSON.stringify({message:m})});let x=await r.json();wait.remove();add(x.answer||x.detail||'No response','a');if(x.specialists)add('Agents: '+x.specialists.join(', '),'t')}catch(e){wait.remove();add(String(e),'a')}};</script></body></html>
