name: Monitor Tests

on:
  push:
    branches:
      - feat/continuous-vps-monitoring
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile app.py core/*.py agents/*.py tools/*.py monitoring/*.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
