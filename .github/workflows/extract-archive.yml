name: Extract agent archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ hashFiles('oracle-vps-agent.tar.gz') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          tar -xzf oracle-vps-agent.tar.gz --strip-components=1
          rm -rf .git __pycache__ agents/__pycache__ core/__pycache__ tools/__pycache__ tests/__pycache__
          rm -f oracle-vps-agent.tar.gz
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract agent source from archive" || exit 0
          git push
