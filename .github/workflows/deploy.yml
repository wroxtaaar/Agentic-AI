name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oracle-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            echo "==> Checking VPS user and home"
            whoami
            echo "HOME=$HOME"
            pwd

            if [ ! -d "$HOME/Agentic-AI/.git" ]; then
              echo "ERROR: $HOME/Agentic-AI is not a Git checkout."
              echo "Clone the repository on the VPS first:"
              echo "  cd ~"
              echo "  git clone https://github.com/wroxtaaar/Agentic-AI.git Agentic-AI"
              exit 1
            fi

            cd "$HOME/Agentic-AI"

            echo "==> Updating repository"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "==> Installing dependencies"
            if [ -d .venv ]; then
              . .venv/bin/activate
            else
              python3 -m venv .venv
              . .venv/bin/activate
            fi
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "==> Validating Python source"
            python -m py_compile app.py core/*.py agents/*.py tools/*.py

            echo "==> Running tests"
            python -m unittest discover -s tests -p 'test_*.py' -v

            echo "==> Restarting agent"
            sudo systemctl restart oracle-vps-agent

            echo "==> Checking service"
            sleep 2
            sudo systemctl is-active --quiet oracle-vps-agent
            curl --fail --silent http://127.0.0.1:8787/health
            echo

            echo "==> Deployment complete"
