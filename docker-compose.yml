services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENT_WORKSPACE_ROOTS: /home/ubuntu
      DIAGNOSTICS_MAX_LOG_LINES: "200"
      AI_BASE_URL: http://freellmapi:3001/v1/chat/completions
      AI_API_KEY: ${FREELLMAPI_API_KEY:-}
      OPENROUTER_API_KEY: ""
      ARCHITECT_MODEL: ${ARCHITECT_MODEL:-auto}
      WORKER_MODEL: ${WORKER_MODEL:-auto}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu:/home/ubuntu
      - agentic-data:/data
    depends_on:
      freellmapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # FreeLLMAPI dashboard/API is localhost-only; use an SSH tunnel to access it.
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:?FREELLMAPI_ENCRYPTION_KEY must be set in .env}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  diagnostics-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "tools/diagnostics_mcp.py"]
    container_name: agentic-diagnostics-mcp
    restart: unless-stopped
    environment:
      AGENT_API_TOKEN: "${AGENT_API_TOKEN:?AGENT_API_TOKEN must be set in .env}"
      DIAGNOSTICS_AGENT_URL: http://agent:8787
      DIAGNOSTICS_MCP_PORT: "8788"
      DIAGNOSTICS_MCP_CONTAINERS: home,docker-control-bot,agentic-ai,agentic-monitor,freellmapi
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'tools/diagnostics_mcp.py' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      DISK_USAGE: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor-backend

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-monitor
    command: ["python", "-m", "monitoring.worker"]
    restart: unless-stopped
    env_file:
      - .env.monitor
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      MONITOR_DB_PATH: /data/monitor.db
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-300}
      MONITOR_CONTAINERS: ${MONITOR_CONTAINERS:-home,docker-control-bot,agentic-ai}
      MONITOR_HEALTH_URLS: ${MONITOR_HEALTH_URLS:-http://host.docker.internal:10000/health}
      MONITOR_LOG_SINCE: ${MONITOR_LOG_SINCE:-10m}
      MONITOR_LOG_TAIL: ${MONITOR_LOG_TAIL:-120}
      MONITOR_RECOVERY_MISSES: ${MONITOR_RECOVERY_MISSES:-2}
      MONITOR_CPU_ALERT_PERCENT: ${MONITOR_CPU_ALERT_PERCENT:-95}
      MONITOR_MEMORY_ALERT_PERCENT: ${MONITOR_MEMORY_ALERT_PERCENT:-90}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - monitor-data:/data
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'monitoring.worker' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - monitor-backend

networks:
  monitor-backend:

volumes:
  agentic-data:
  monitor-data:
  freellmapi-data:
